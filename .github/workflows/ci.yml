name: CI

# Sanity checks on every PR targeting main, so problems are caught before a
# merge triggers a production deploy.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Setup Lambda dependencies
        working-directory: lambda
        run: npm ci

      - name: Typecheck Lambda
        working-directory: lambda
        run: npm run typecheck

      - name: Build Lambda bundle
        working-directory: lambda
        run: npm run build
