AWSTemplateFormatVersion: "2010-09-09"
Description: >
  us-east-1-only resources for the Codistica website: the ACM certificate
  (CloudFront can only use certificates issued in us-east-1, regardless of
  where the rest of the infrastructure lives) and the WAF WebACL (CLOUDFRONT
  scope WebACLs are likewise only created in us-east-1). Kept as a separate
  stack so the main stack can run in another region. Validation records are
  created automatically in Route 53.

Parameters:
  ProjectName:
    Type: String
    Default: codistica-website
    Description: Tag/label applied to created resources - matches the main stack's ProjectName.
  DomainName:
    Type: String
    Description: Apex domain, e.g. codistica.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for DomainName (enables automatic DNS validation).
  IncludeWww:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Also cover www.<DomainName> on the certificate (needed for the www->apex redirect).
  ApiRateLimitPerFiveMin:
    Type: Number
    Default: 100
    Description: >-
      Requests to /api/* a single IP can make per rolling 5-minute window
      before WAF blocks it. 100 is the AWS-enforced minimum for a rate-based
      rule - generous for a real visitor (a form view is a handful of
      requests), a hard stop for a scripted flood.

Conditions:
  WithWww: !Equals [!Ref IncludeWww, "true"]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      SubjectAlternativeNames: !If
        - WithWww
        - [!Sub "www.${DomainName}"]
        - !Ref AWS::NoValue
      # ACM auto-creates the validation CNAMEs in the hosted zone - no manual step.
      DomainValidationOptions: !If
        - WithWww
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId

  # Rate-limits only /api/* (the form-submission Lambda) - static pages are
  # cheap to serve and cached at the edge anyway, so there's nothing there
  # worth rate-limiting. DefaultAction Allow means every other request is
  # untouched; only IPs that cross the threshold on /api/* get blocked.
  ApiRateLimitWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-api-rate-limit"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-webacl"
      Rules:
        - Name: RateLimitApi
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref ApiRateLimitPerFiveMin
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: "/api/"
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
                  PositionalConstraint: STARTS_WITH
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-rate-limit-api"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  CertificateArn:
    Description: ACM certificate ARN - passed to the main stack's CertificateArn parameter.
    Value: !Ref Certificate
  WebAclArn:
    Description: WAF WebACL ARN (CLOUDFRONT scope) - passed to the main stack's WebAclArn parameter.
    Value: !GetAtt ApiRateLimitWebAcl.Arn
